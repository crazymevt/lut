name: Cross-platform LUT webview
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: cef-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev xvfb libgl1-mesa-dri libgl1 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libgtk-3-0t64
      - uses: actions/cache@v4
        with:
          path: webview/.cache
          key: webview-sdk-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('webview/sdk-lock.json', 'webview/dependencies-lock.json') }}
      - name: Set up isolated SBCL
        run: python webview/scripts/setup-sbcl.py
      - name: Prepare pinned Lisp dependencies and raylib
        run: python webview/scripts/prepare.py
      - name: Headless LUT regression suite
        run: sbcl --script webview/tests/headless.lisp
      - name: Fresh compilation without undefined symbols
        run: python webview/scripts/check-clean-build.py
      - name: Verify CRLF metadata and short cache paths
        run: python webview/scripts/check-cache.py
      - name: Verify native errors fail CI
        run: python webview/scripts/check-runner.py
      - name: Build pinned CEF bridge and stage runtime
        run: python webview/scripts/build.py --download
      - name: Linux CEF offscreen bridge and trusted-page messages
        if: runner.os == 'Linux'
        env:
          LUT_CEF_DISABLE_GPU: '1'
        run: xvfb-run -a sbcl --script webview/tests/cef-offscreen.lisp
      - name: Native Linux smoke test
        if: runner.os == 'Linux'
        env:
          LUT_WEBVIEW_SMOKE: '1'
          LUT_WEBVIEW_FRAMES: '600'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x900x24' sbcl --script webview/scripts/run.lisp
      - name: CEF offscreen bridge and trusted-page messages
        if: runner.os != 'Linux'
        env:
          LUT_CEF_DISABLE_GPU: '1'
        run: sbcl --script webview/tests/cef-offscreen.lisp
      - name: Native Windows smoke test (bundled Mesa)
        if: runner.os == 'Windows'
        env:
          LUT_WEBVIEW_SMOKE: '1'
          LUT_WEBVIEW_FRAMES: '600'
          GALLIUM_DRIVER: llvmpipe
        run: sbcl --script webview/scripts/run.lisp
      - name: Assemble offline Windows/Linux test bundle
        if: runner.os != 'macOS'
        run: python webview/scripts/package.py
      - name: Test extracted Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUT_WEBVIEW_SMOKE: '1'
          LUT_WEBVIEW_FRAMES: '600'
        run: |
          Expand-Archive dist/lut-webview-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/relocated bundle"
          & "$env:RUNNER_TEMP/relocated bundle/lut-webview-windows-x64/test.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test extracted Linux bundle on Fedora
        timeout-minutes: 6
        if: runner.os == 'Linux'
        run: |
          docker run --init --rm --shm-size=1g -v "$PWD/dist:/dist:ro" fedora:latest bash -lc '
            set -eux
            cat /etc/os-release
            dnf install -y xorg-x11-server-Xvfb mesa-libGL mesa-dri-drivers nss atk at-spi2-atk libXcomposite libXdamage libXrandr libxkbcommon alsa-lib cups-libs gtk3 tar gzip
            mkdir -p "/tmp/relocated bundle"
            tar -xzf /dist/lut-webview-linux-x64.tar.gz -C "/tmp/relocated bundle"
            Xvfb :99 -screen 0 1280x900x24 >/tmp/xvfb.log 2>&1 &
            sleep 2
            cd "/tmp/relocated bundle/lut-webview-linux-x64"
            DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 LUT_WEBVIEW_SMOKE=1 LUT_WEBVIEW_FRAMES=600 sh -x ./start.sh
          '
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'macOS' && hashFiles('dist/*.sha256') != ''
        with:
          name: lut-webview-${{ runner.os }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-test-build:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lut-webview-*-x64
          merge-multiple: true
          path: release-artifacts
      - name: Publish tested Windows and Linux downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: webview-test-${{ github.run_number }}-${{ github.run_attempt }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'NOTES'
          Standalone LUT/CEF development test builds. All three platform checks must pass before this release is published.

          **Windows x64:** extract the ZIP, then double-click `Start LUT Webview.cmd`.
          **Fedora Linux x64:** extract the tar.gz, then run `./start.sh` in your desktop session (X11 or XWayland).

          SBCL, Lisp dependencies, raylib and CEF are included. No Lisp/compiler installation or build step is required. First launch compiles the bundled Lisp sources into your user cache. Linux requires glibc 2.38+ and normal desktop graphics/runtime libraries.

          Development prototype: Chromium sandbox is disabled; use trusted test content. See the included READ ME and webview documentation for remaining limits. SHA-256 files accompany both archives.
          NOTES
          gh release create "$BUILD_TAG" release-artifacts/* --target "$BUILD_COMMIT" --prerelease --title "LUT webview test build ${{ github.run_number }}" --notes-file release-notes.md
